<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dagritme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Dagritme</title>
</head>
<body>
<main id="app"></main>
<nav class="nav" id="nav" aria-label="Hoofdmenu"><i class="pill" aria-hidden="true"></i><button data-a="tab" data-i="routine">Routine</button><button data-a="tab" data-i="agenda">Agenda</button><button data-a="tab" data-i="lijsten">Lijsten</button><button data-a="tab" data-i="notities">Notities</button><button data-a="tab" data-i="inzicht">Inzicht</button></nav>
<button class="fab hide" id="fab" aria-label="Toevoegen" tabindex="-1">+</button>
<div id="sh" class="ov" aria-hidden="true"><div class="sheet" id="shc" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div id="mn" class="ov" aria-hidden="true"><div class="sheet" id="mnc" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div id="up" role="status"><span>Nieuwe versie geladen.</span><button data-a="rl">Verversen</button></div>
<div id="ts" role="status"></div>
<input type="file" id="imf" accept="application/json,.json" hidden>
<noscript>Dagritme heeft JavaScript nodig.</noscript>
<script src="app.js"></script>
</body>
</html>
